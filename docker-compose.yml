# Local/staging deployment: PostgreSQL 17, Redis 7, the API behind Caddy (automatic local TLS).
# Copy .env.example to .env and run scripts/generate-secrets.sh first.
name: veil

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: veil
      POSTGRES_USER: veil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veil -d veil"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: src/Veil.Api/Dockerfile
    image: veil-api:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=veil;Username=veil;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      Security__FieldEncryptionKey: ${VEIL_FIELD_ENCRYPTION_KEY:?run scripts/generate-secrets.sh}
      Security__BlindIndexKey: ${VEIL_BLIND_INDEX_KEY:?run scripts/generate-secrets.sh}
      Security__IpHashSalt: ${VEIL_IP_HASH_SALT:?run scripts/generate-secrets.sh}
      Security__JwtSigningKeyPem: ${VEIL_JWT_SIGNING_KEY_PEM:?run scripts/generate-secrets.sh}
      Database__MigrateOnStartup: "true"
      ReverseProxy__Enabled: "true"
      ReverseProxy__KnownProxies__0: "172.16.0.0"
      OpenApi__Enabled: ${VEIL_OPENAPI_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      VEIL_DOMAIN: ${VEIL_DOMAIN:-localhost}

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
