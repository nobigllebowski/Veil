version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql*", "Aspire.*"]
      opentelemetry:
        patterns: ["OpenTelemetry.*", "Serilog*"]
      testing:
        patterns: ["xunit*", "Shouldly", "NSubstitute", "Testcontainers*", "NetArchTest*", "Bogus"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /src/Veil.Api
    schedule:
      interval: weekly
